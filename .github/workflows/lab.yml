name: Private lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Linux lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify lint, formatting, types and tests
        run: npm run verify
      - name: Demo and benchmark smoke checks
        run: |
          npm run demo
          npm run bench -- compare 1 2
          npm run bench:restart -- 2
      - name: Confirm source was not mutated
        run: git diff --exit-code
